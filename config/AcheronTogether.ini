[Checkpoints]
; Every successful Skyrim save event (manual save, quicksave, autosave) requests a checkpoint.
OnSave=1

; Fallback checkpoint after a cell transition involving an interior.
; Leave enabled if you want dungeon entrances to remain checkpoints even when autosaves are disabled.
OnInteriorTransition=1

; Periodic exterior checkpoint while out of combat.
PeriodicOutdoor=1
OutdoorIntervalMinutes=5.0

; Create a checkpoint after loading/new game once the player is available.
InitialAfterLoad=1

; HUD message after a checkpoint is successfully updated.
ShowNotification=1

[Respawn]
; When no other STR player is present, Defeated behaves like a delayed solo wipe.
; Rescue or true death cancels this timer.
SoloDefeat=1
SoloDefeatDelaySeconds=30.0

; True Skyrim death (including lethal killmoves) respawns only the local player.
IndividualTrueDeath=1
TrueDeathDelaySeconds=1.5

; If every known STR player is defeated/dead, recover everyone locally at their own checkpoint.
PartyWipe=1
PartyWipeDelaySeconds=1.25

[Debug]
; F6 = simulated defeat, F7 = simulated true death.
EnableHotkeys=1
